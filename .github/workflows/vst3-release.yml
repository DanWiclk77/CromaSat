name: Build & Artifact VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        run: |
          npm install
          npm run build

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target CromaSat_VST3

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: CromaSat-Windows-VST3
          path: build/CromaSat_artefacts/Release/VST3/CromaSat.vst3

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        run: |
          npm install
          npm run build

      - name: Configure CMake
        run: cmake -B build -G "Xcode" -DCMAKE_BUILD_TYPE=Release

      - name: Build AU/VST3
        run: cmake --build build --config Release

      - name: Upload AU/VST3
        uses: actions/upload-artifact@v4
        with:
          name: CromaSat-Mac-VST3-AU
          path: build/CromaSat_artefacts/Release/
